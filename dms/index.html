<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; background: #fff; }
  body { margin: 0; background: #fff; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }

  .slide { position: relative; width: 100%; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; container-type: inline-size; overflow: hidden; }
  .lay, .mid, .hot, .snow { position: absolute; }
  .lay { display: block; user-select: none; pointer-events: none; }
  .frame img { -webkit-user-drag: none; user-select: none; }

  /* появление слайда */
  .js .slide .frame { opacity: 0; transform: translateY(40px) scale(.985); transition: opacity .9s ease, transform 1.1s cubic-bezier(.2,.8,.2,1); }
  .js .slide.in .frame { opacity: 1; transform: none; }

  /* подвижный слой: параллакс при прокрутке + собственное движение */
  .mid { pointer-events: none; }
  .mid .par, .mid .anim { position: absolute; inset: 0; will-change: transform; }
  .mid .par { transform: translate3d(0, calc(var(--p, 0) * var(--px, -2.2cqw)), 0); }
  .mid img { position: absolute; display: block; width: 100%; height: 100%; }
  .mid .glow { animation: glow 3.6s ease-in-out infinite; opacity: .4; }
  @keyframes glow { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }

  .mv-float .anim { transform-origin: 50% 100%; animation: float 7s ease-in-out infinite; }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1) rotate(0); }
    50% { transform: translateY(-1.1%) scale(1.018) rotate(-.6deg); }
  }
  .mv-jump .anim { transform-origin: 50% 100%; animation: jump 2.8s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes jump {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    12% { transform: translateY(.6%) scale(1.01, .985); }
    45% { transform: translateY(-3.2%) scale(.995, 1.01) rotate(.8deg); }
    55% { transform: translateY(-3.2%) scale(.995, 1.01) rotate(-.8deg); }
    88% { transform: translateY(0) scale(1, 1); }
  }
  .mv-glide .anim { transform-origin: 45% 60%; animation: glide 6s ease-in-out infinite; }
  @keyframes glide {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    35% { transform: translate(-1.6%, -2.4%) rotate(-2.2deg); }
    70% { transform: translate(.8%, -.8%) rotate(.8deg); }
  }
  .mv-kb { --px: -1.4cqw; }
  .mv-kb .anim { animation: kb 22s ease-in-out infinite alternate; }
  @keyframes kb { from { transform: scale(1.05); } to { transform: scale(1.12) translate(-1%, -.6%); } }
  /* на обложке заголовок впечатан в фото: движение совсем лёгкое, чтобы он не уезжал */
  .mv-kb1 { --px: -.45cqw; }
  .mv-kb1 .anim { transform-origin: 50% 30%; animation: kb1 16s ease-in-out infinite alternate; }
  @keyframes kb1 { from { transform: scale(1.018); } to { transform: scale(1.045); } }

  .slide:not(.live) .anim, .slide:not(.live) .glow, .slide:not(.live) .hot, .slide:not(.live) .kb { animation-play-state: paused; }

  /* снег на обложке */
  .snow { inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* карточки и плашки */
  .hot {
    display: block; overflow: hidden; border-radius: var(--r); z-index: 2;
    pointer-events: none; will-change: transform;
    transition: transform .45s cubic-bezier(.34,1.56,.64,1), box-shadow .45s ease, filter .45s ease;
  }
  .hot img { display: block; width: 100%; height: 100%; }
  .hot::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.45) 48%, transparent 66%);
    transform: translateX(-120%);
  }
  a.hot { pointer-events: auto; }

  /* по очереди подсвечиваются, когда слайд на экране */
  .slide.live .hot { animation: pop 1.1s cubic-bezier(.34,1.4,.64,1) calc(var(--i) * 160ms + .35s); }
  .slide.live .hot::after { animation: sheen 1.1s ease calc(var(--i) * 160ms + .5s); }
  .slide.live .hot--item { animation-name: pop-item; }
  @keyframes pop {
    0%, 100% { transform: none; box-shadow: none; }
    40% { transform: scale(1.04); box-shadow: 0 0 0 .08cqw rgba(255,255,255,.6), 0 0 2.4cqw color-mix(in srgb, var(--glow) 50%, transparent); }
  }
  @keyframes pop-item {
    0%, 100% { transform: none; box-shadow: none; }
    40% { transform: scale(1.035); box-shadow: 0 0 0 .07cqw rgba(255,255,255,.6), 0 0 2.6cqw rgba(255,255,255,.4); }
  }
  @keyframes sheen { from { transform: translateX(-120%); } to { transform: translateX(120%); } }
  /* слайды 3-5: плашки стоят на месте, двигается и светится только человек */
  .slide.calm.live .hot, .slide.calm.live .hot::after { animation: none; }

  /* фото на слайде 2 медленно наезжает */
  .hot--photo .kb { position: absolute; inset: 0; animation: kb 18s ease-in-out infinite alternate; }
  .slide.live .hot--photo { animation: none; }

  /* кнопки связи пульсируют */
  .slide.live .hot--cta {
    animation: pop 1.1s cubic-bezier(.34,1.4,.64,1) calc(var(--i) * 160ms + .35s), pulse 2.8s ease-in-out 2.4s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--glow) 0%, transparent); }
    50% { box-shadow: 0 0 0 .5cqw color-mix(in srgb, var(--glow) 18%, transparent), 0 0 2cqw color-mix(in srgb, var(--glow) 30%, transparent); }
  }

  /* компьютер с мышкой: наведение и нажатие */
  @media (hover: hover) and (pointer: fine) {
    .hot { pointer-events: auto; cursor: pointer; }
    .hot--item, .hot--photo { cursor: default; }
    .hot:hover, .hot:focus-visible {
      z-index: 3; outline: none; animation: none !important;
      transform: translateY(-.25cqw) scale(1.035);
      box-shadow: 0 0 0 .08cqw rgba(255,255,255,.55),
        0 1.2cqw 2.6cqw -.8cqw color-mix(in srgb, var(--glow) 55%, transparent),
        0 0 2.4cqw color-mix(in srgb, var(--glow) 45%, transparent);
      filter: brightness(1.04) saturate(1.06);
    }
    .hot:hover::after { animation: sheen 1.1s ease forwards !important; }
    .hot--pill:hover, .hot--cta:hover { transform: translateY(-.25cqw) scale(1.07); }
    .hot--photo:hover { transform: scale(1.02); }
    .hot--item:hover { transform: scale(1.04); box-shadow: 0 0 0 .07cqw rgba(255,255,255,.6), 0 0 2.6cqw rgba(255,255,255,.35), 0 1cqw 2.4cqw -1cqw rgba(0,0,0,.35); }
    .hot.hot:active { transform: translateY(.05cqw) scale(.975); transition-duration: .12s; }
  }

  /* навигация */
  .dots {
    position: fixed; right: 18px; top: 50%; transform: translateY(-50%); z-index: 10;
    display: flex; flex-direction: column; gap: 10px; padding: 10px 7px; border-radius: 99px;
    background: rgba(255,255,255,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 4px 18px rgba(0,0,0,.12);
  }
  .dots a { display: block; width: 9px; height: 9px; border-radius: 99px; background: rgba(5,72,129,.28);
    transition: height .35s cubic-bezier(.34,1.56,.64,1), background .3s, transform .25s; }
  .dots a:hover { transform: scale(1.35); background: rgba(5,72,129,.6); }
  .dots a.on { height: 26px; background: #054881; box-shadow: 0 0 10px rgba(5,72,129,.5); }
  @media (max-width: 700px) { .dots { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    .js .slide .frame { opacity: 1; transform: none; }
    .mid .par { transform: none; }
  }
</style>

<script>
(() => {
  const slides = [...document.querySelectorAll('.slide')];
  const dots = [...document.querySelectorAll('.dots a')];
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // появление (один раз)
  const reveal = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); reveal.unobserve(e.target); }
  }), { threshold: .15 });
  slides.forEach(s => reveal.observe(s));

  // «живой» слайд: анимации идут только на экране, подсветка карточек повторяется при каждом заходе
  const live = new Set();
  const liveObs = new IntersectionObserver(es => es.forEach(e => {
    e.target.classList.toggle('live', e.isIntersecting);
    e.isIntersecting ? live.add(e.target) : live.delete(e.target);
    tick();
  }), { threshold: .35 });
  slides.forEach(s => liveObs.observe(s));

  // активная точка навигации
  const spy = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) dots.forEach((d, i) => d.classList.toggle('on', slides[i] === e.target));
  }), { rootMargin: '-45% 0px -45% 0px' });
  slides.forEach(s => spy.observe(s));

  // параллакс
  let raf = 0;
  function tick() {
    if (raf || still) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const vh = innerHeight;
      for (const s of slides) {
        const r = s.getBoundingClientRect();
        if (r.bottom < -100 || r.top > vh + 100) continue;
        const p = Math.max(-1, Math.min(1, (r.top + r.height / 2 - vh / 2) / vh));
        s.style.setProperty('--p', p.toFixed(4));
      }
    });
  }
  addEventListener('scroll', tick, { passive: true });
  addEventListener('resize', tick);
  tick();

  // снег
  document.querySelectorAll('.snow').forEach(cv => {
    if (still) return;
    const slide = cv.closest('.slide'), ctx = cv.getContext('2d');
    let w = 0, h = 0, flakes = [];
    const size = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      w = cv.clientWidth; h = cv.clientHeight;
      cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(Math.min(110, w / 12));
      flakes = Array.from({ length: n }, () => ({
        x: Math.random() * w, y: Math.random() * h, r: .6 + Math.random() * 2.2 * (w / 1400 + .4),
        s: .25 + Math.random() * .8, d: Math.random() * Math.PI * 2, o: .35 + Math.random() * .5
      }));
    };
    size(); addEventListener('resize', size);
    let last = performance.now();
    const loop = t => {
      const dt = Math.min(50, t - last) / 16.7; last = t;
      if (slide.classList.contains('live')) {
        ctx.clearRect(0, 0, w, h);
        for (const f of flakes) {
          f.d += .012 * dt; f.y += f.s * dt * (w / 900 + .3); f.x += Math.sin(f.d) * .35 * dt;
          if (f.y > h + 5) { f.y = -5; f.x = Math.random() * w; }
          ctx.globalAlpha = f.o; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fillStyle = '#fff'; ctx.fill();
        }
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });

  // клавиши
  addEventListener('keydown', e => {
    const k = e.key;
    if (!['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp'].includes(k)) return;
    const y = scrollY + innerHeight * .5;
    let cur = slides.findIndex(s => s.offsetTop <= y && s.offsetTop + s.offsetHeight > y);
    if (cur < 0) cur = 0;
    const next = Math.max(0, Math.min(slides.length - 1, cur + (k === 'ArrowDown' || k === 'PageDown' ? 1 : -1)));
    e.preventDefault();
    slides[next].scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
})();
</script>
</body>
</html>
