<title>Праздники на льду · Охта Парк</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; background: #fff; }
  body { margin: 0; background: #fff; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
  .frame { position: relative; width: 100%; container-type: inline-size; overflow: hidden; }
  .lay, .mid, .link, .frame canvas, .frame svg, .station, .gl, .skates { position: absolute; }
  .lay, .mid, .frame canvas, .frame svg, .station, .gl, .skates { pointer-events: none; }
  .frame canvas, .frame svg { inset: 0; width: 100%; height: 100%; }
  .frame img { display: block; user-select: none; -webkit-user-drag: none; }

  .mid .anim { position: absolute; inset: 0; will-change: transform; }
  .mid img { width: 100%; height: 100%; }
  .slide:not(.live) .anim { animation-play-state: paused; }
  .mv-sway .anim, .mv-sway2 .anim { animation: sway 6s ease-in-out infinite; }
  .mv-sway2 .anim { animation-duration: 7.5s; animation-delay: -2s; animation-direction: reverse; }
  @keyframes sway { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.6deg) translateY(-.8%); } }

  /* снеговик на коньке и сидящий: голова */
  .mv-rock .anim { animation: rock var(--dur, 4.8s) ease-in-out infinite; }
  @keyframes rock { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  .mv-nod .anim { animation: nod 5.6s ease-in-out infinite; }
  @keyframes nod { 0%, 100% { transform: rotate(-2.5deg); } 45% { transform: rotate(2deg); } 60% { transform: rotate(2.3deg); } }

  /* фото: падают и проявляются */
  .js .photo { opacity: 0; }
  .slide.played .photo { animation: drop 1s cubic-bezier(.2,.75,.3,1.08) var(--d) both; }
  .slide.played .photo img { animation: develop 1.8s ease-out calc(var(--d) + .35s) both; }
  @keyframes drop {
    0% { opacity: 0; transform: translate(-5%, -32%) rotate(-11deg) scale(1.1); }
    35% { opacity: 1; }
    65% { transform: translate(0, 1.2%) rotate(1.4deg) scale(1); }
    82% { transform: translate(0, -.5%) rotate(-.4deg); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes develop {
    0% { filter: sepia(.5) hue-rotate(170deg) saturate(.45) brightness(1.6) contrast(.5); }
    100% { filter: sepia(0) hue-rotate(0deg) saturate(1) brightness(1) contrast(1); }
  }

  /* стикеры */
  .js .stk .anim { opacity: 0; }
  .slide.played .stk .anim { animation: slap .95s cubic-bezier(.3,.7,.35,1) var(--d) both; }
  @keyframes slap {
    0% { opacity: 0; transform: perspective(500px) translate(10%, -40%) rotate(var(--r)) scale(1.7);
         filter: drop-shadow(0 2.2cqw 1.6cqw rgb(0 20 60 / .3)); }
    45% { opacity: 1; transform: perspective(500px) rotate(1.5deg) scale(.92);
          filter: drop-shadow(0 .2cqw .3cqw rgb(0 20 60 / .25)); }
    62% { transform: perspective(500px) rotateX(14deg) rotate(-1deg) scale(1.04); }
    78% { transform: perspective(500px) rotateX(-6deg) scale(.99); }
    90% { transform: perspective(500px) rotateX(2deg) scale(1.005); }
    100% { opacity: 1; transform: none; filter: drop-shadow(0 0 0 rgb(0 20 60 / 0)); }
  }

  /* блик и кромка по форме карточки */
  .gl i { position: absolute; inset: 0; -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  .gl .halo { background: rgb(150 196 255); opacity: 0; }
  .gl.dark .halo { background: rgb(170 210 255); }
  .gl .sheen { background: linear-gradient(112deg, transparent 0 40%, rgb(150 190 255 / .32) 45%,
      rgb(255 255 255 / .8) 50%, rgb(150 190 255 / .32) 55%, transparent 60% 100%);
    background-size: 300% 100%; background-position: 100% 0; mix-blend-mode: normal; }

  /* заголовок: слова по очереди */
  .word { transform-origin: 50% 60%; will-change: transform; }
  .word img { width: 100%; height: 100%; }

  /* коньки на шнурке */
  .skates img { position: absolute; inset: 0; width: 100%; height: 100%; will-change: transform; }

  /* дуга на фоне */
  .arc .arc-rv { fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; }
  .arc .arc-t { opacity: 0; transition: opacity 3s ease; }
  .arc .arc-head { fill: rgb(140 185 250); opacity: 0; }
  .arc .arc-core { fill: #fff; }

  /* иней на обложке */
  .js .frost { background: rgb(228 238 249 / .92); }
  .js .frost.drawn { background: none; }

  /* след конька на обложке */
  .trail .cut { fill: none; stroke: rgb(255 255 255 / .9); stroke-width: 2.2; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1; filter: drop-shadow(0 0 3px rgb(200 230 255 / .9)); }
  .trail .cut2 { stroke-width: 1.2; stroke: rgb(255 255 255 / .55); }
  .slide.played .trail .cut { animation: carve 3.2s cubic-bezier(.45,.05,.3,1) forwards, fade 5s ease 4.2s forwards; }
  .slide.played .trail .cut2 { animation-delay: .12s, 4.3s; }
  @keyframes carve { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: .35; } }

  /* маршрут на слайде 10 */
  .route path { fill: none; stroke-linecap: round; }
  .route .rt-glow { stroke: rgb(255 255 255 / .9); stroke-width: 7; stroke-dasharray: 1; stroke-dashoffset: 1;
    filter: drop-shadow(0 0 4px rgb(120 170 255 / .8)); opacity: .55; }
  .route .rt-mask { display: none; }
  .route .rt-dash { stroke: #2f5fd8; stroke-width: 3; stroke-dasharray: 2 9; }
  .route .rt-reveal { stroke: #fff; stroke-width: 14; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .slide.played .route .rt-glow, .slide.played .route .rt-reveal { animation: carve 3.4s cubic-bezier(.5,0,.4,1) .5s forwards; }
  .station { border-radius: 1.85cqw; opacity: 0; }
  .slide.played .station { animation: station 1.4s ease calc(.5s + var(--k) * .68s) forwards; }
  @keyframes station {
    0% { opacity: 0; box-shadow: 0 0 0 0 rgb(120 170 255 / 0); }
    30% { opacity: 1; box-shadow: 0 0 0 .3cqw rgb(255 255 255 / .95), 0 0 3cqw .6cqw rgb(110 160 255 / .8); }
    100% { opacity: 1; box-shadow: 0 0 0 .15cqw rgb(255 255 255 / .6), 0 0 1.2cqw rgb(110 160 255 / .35); }
  }

  .link { display: block; border-radius: 99px; transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s; pointer-events: auto; }
  @media (hover: hover) { .link:hover { transform: scale(1.04); box-shadow: 0 0 2.4cqw rgba(214,240,40,.7); } }
  .link.card { border-radius: 1.85cqw; cursor: pointer; }
  @media (hover: hover) { .link.card:hover { transform: translateY(-.3cqw); box-shadow: 0 0 0 .15cqw rgb(255 255 255 / .7), 0 1cqw 2.4cqw rgb(90 130 230 / .35); } }
  .link.card:active { transform: scale(.985); transition-duration: .1s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    .js .frost, .snow, .arc-head { display: none; }
    .js .photo, .js .stk .anim { opacity: 1; }
    .trail .cut, .route .rt-glow, .route .rt-reveal { stroke-dashoffset: 0; }
    .station { opacity: 0; }
  }
</style>

<script>
(() => {
  const slides = [...document.querySelectorAll('.slide')];
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a), TAU = Math.PI * 2;
  const dprOf = () => Math.min(devicePixelRatio || 1, 2);
  const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

  // ---------- иней и оттаивание (обложка) ----------
  function frostTexture(w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(228,238,249,.92)'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < w * h / 90; i++) {
      g.fillStyle = `rgba(255,255,255,${rnd(.05, .35)})`; g.fillRect(rnd(0, w), rnd(0, h), rnd(.6, 1.8), rnd(.6, 1.8));
    }
    g.lineCap = 'round';
    const branch = (x, y, a, len, depth) => {
      const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
      g.strokeStyle = `rgba(255,255,255,${.35 + depth * .12})`; g.lineWidth = Math.max(.5, depth * .55);
      g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
      if (depth <= 0) return;
      const n = 3 + (Math.random() * 3 | 0);
      for (let i = 1; i <= n; i++) {
        const t = i / (n + 1), px = x + (x2 - x) * t, py = y + (y2 - y) * t, l = len * rnd(.25, .45) * (1 - t * .5);
        branch(px, py, a + .95, l, depth - 1); branch(px, py, a - .95, l, depth - 1);
      }
      branch(x2, y2, a + rnd(-.25, .25), len * .55, depth - 1);
    };
    const S = Math.max(w, h);
    for (let i = 0; i < 26; i++) {
      const side = i % 4, x = side === 0 ? 0 : side === 1 ? w : rnd(0, w), y = side === 2 ? 0 : side === 3 ? h : rnd(0, h);
      branch(x, y, Math.atan2(h / 2 - y, w / 2 - x) + rnd(-.7, .7), S * rnd(.06, .14), 3);
    }
    for (let i = 0; i < 18; i++) branch(rnd(0, w), rnd(0, h), rnd(0, TAU), S * rnd(.02, .05), 2);
    return c;
  }
  function thaw(slide) {
    const cv = slide.querySelector('.frost'); if (!cv) return;
    if (still) { cv.remove(); return; }
    const dpr = Math.min(dprOf(), 1.5), w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
    cv.width = w; cv.height = h; cv.classList.add('drawn');
    const ctx = cv.getContext('2d'), tex = frostTexture(w, h);
    const R = Math.hypot(w, h) * .62, cx = w * rnd(.42, .58), cy = h * rnd(.42, .58);
    const wob = Array.from({ length: 7 }, () => [rnd(2, 7) | 0, rnd(0, TAU), rnd(.03, .09)]);
    const t0 = performance.now() + 250, dur = 1900;
    const S = 12, mk = document.createElement('canvas'); mk.width = Math.ceil(w / S); mk.height = Math.ceil(h / S);
    const mc = mk.getContext('2d');
    const step = now => {
      const k = Math.max(0, Math.min(1, (now - t0) / dur)), e = k * k * (3 - 2 * k);
      ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, w, h); ctx.globalAlpha = 1 - Math.max(0, k - .85) / .15;
      ctx.drawImage(tex, 0, 0);
      const r = R * e;
      if (r > 1) {
        mc.clearRect(0, 0, mk.width, mk.height); mc.fillStyle = '#fff'; mc.beginPath();
        for (let i = 0; i <= 96; i++) {
          const a = i / 96 * TAU; let m = 1;
          for (const [f, p, amp] of wob) m += amp * Math.sin(a * f + p);
          mc.lineTo((cx + Math.cos(a) * r * m) / S, (cy + Math.sin(a) * r * m) / S);
        }
        mc.fill();
        ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = true;
        ctx.drawImage(mk, 0, 0, mk.width * S, mk.height * S);
      }
      if (k < 1) requestAnimationFrame(step); else cv.remove();
    };
    requestAnimationFrame(step);
  }

  // ---------- блик по карточкам ----------
  function shine(gl, delay, strong) {
    const sheen = gl.querySelector('.sheen'), halo = gl.querySelector('.halo');
    sheen.animate([{ backgroundPosition: '100% 0' }, { backgroundPosition: '0% 0' }],
      { duration: strong ? 1150 : 1400, delay, easing: 'cubic-bezier(.45,.05,.35,1)' });
    halo.animate([{ opacity: 0 }, { opacity: strong ? .95 : .55, offset: .4 }, { opacity: 0 }],
      { duration: strong ? 1500 : 1700, delay, easing: 'ease-out' });
  }

  let lastShine = -1e9, nextShine = 0;
  function shineRandom(scope) {
    const vh = innerHeight, els = [...scope.querySelectorAll('.gl')].filter(g => {
      const r = g.getBoundingClientRect(), m = r.height * .15; return r.top + m >= 0 && r.bottom - m <= vh;
    });
    if (!els.length) return false;
    shine(els[Math.random() * els.length | 0], 0, true);
    lastShine = performance.now(); nextShine = lastShine + rnd(15000, 22000);
    return true;
  }
  setInterval(() => {
    if (still || document.hidden || performance.now() < nextShine) return;
    shineRandom(document);
  }, 500);

  // плашки-кнопки: блик при наведении и нажатии
  document.querySelectorAll('.link.card').forEach(l => {
    const gl = l.closest('.frame').querySelector(`.gl[data-b="${l.dataset.b}"]`); let t = 0;
    const go = () => { const now = performance.now(); if (gl && !still && now - t > 1300) { t = now; shine(gl, 0, true); } };
    l.addEventListener('pointerenter', go); l.addEventListener('pointerdown', go);

  const arcs = new Map();
  for (const svg of document.querySelectorAll('.arc')) {
    const p = svg.querySelector('.arc-rv'), L = p.getTotalLength();
    p.style.strokeDasharray = `${L} ${L + 10}`;
    if (!still) { p.style.strokeDashoffset = L; svg.querySelector('.arc-t').style.opacity = 1; }
    arcs.set(svg, { p, L });
  }
  function drawArc(svg) {
    const { p, L } = arcs.get(svg), heads = svg.querySelectorAll('.arc-head'), tint = svg.querySelector('.arc-t');
    const t0 = performance.now() + 150, dur = 2300;
    const step = now => {
      const k = Math.max(0, Math.min(1, (now - t0) / dur)), e = ease(k);
      p.style.strokeDashoffset = L * (1 - e);
      const pt = p.getPointAtLength(L * e);
      heads.forEach(h => { h.setAttribute('cx', pt.x); h.setAttribute('cy', pt.y); h.style.opacity = k > 0 && k < 1 ? .95 : 0; });
      if (k < 1) requestAnimationFrame(step); else tint.style.opacity = 0;
    };
    requestAnimationFrame(step);
  }

  // ---------- коньки: два маятника и бант ----------
  let scrollV = 0;
  const swings = [...document.querySelectorAll('.skates')].map(el => {
    const back = el.querySelector('.sk-back'), front = el.querySelector('.sk-front'), bow = el.querySelector('.sk-bow');
    const D = Math.PI / 180;
    let c = rnd(-3, 3) * D, vc = 0, r = 0, vr = 0, b = 0, vb = 0, ph1 = rnd(0, TAU), ph2 = rnd(0, TAU);
    const wc = TAU / 2.9, wr = TAU / 1.7, wb = TAU / .55;
    return (dt, t) => {
      if (!el.closest('.slide').classList.contains('live')) return;
      // общий маятник: тихая собственная раскачка + подкачка прокруткой
      const pump = Math.min(Math.abs(scrollV), 3500) * .0009 * Math.sign(vc || 1);
      const ac = -wc * wc * c - .55 * vc + .045 * Math.sin(wc * t + ph1) + pump;
      vc += ac * dt; c += vc * dt; c = Math.max(-14 * D, Math.min(14 * D, c));
      // разница между коньками: свой ритм, упоры с отскоком (стук)
      const ar = -wr * wr * r - .5 * vr + .06 * Math.sin(wr * .83 * t + ph2) - ac * .12;
      vr += ar * dt; r += vr * dt;
      if (r < -.9 * D) { r = -.9 * D; if (vr < -.02) vb += vr * 6; vr = -vr * .45; }
      if (r > 1.2 * D) { r = 1.2 * D; vr = -vr * .4; }
      // бант пружинит
      const ab = -wb * wb * b - 6 * vb - ac * .35;
      vb += ab * dt; b += vb * dt;
      const deg = v => (v / D).toFixed(3);
      back.style.transform = `rotate(${deg(c - r / 2)}deg)`;
      front.style.transform = `rotate(${deg(c + r / 2)}deg)`;
      bow.style.transform = `rotate(${deg(c * .25 + b)}deg) scale(${(1 + Math.min(.06, Math.abs(vb) * .25)).toFixed(4)})`;
    };
  });

  // ---------- снег ----------
  const pointer = { x: -1e4, y: -1e4, vx: 0, vy: 0, t: 0, on: false };
  const setPointer = (x, y) => {
    const now = performance.now(), dt = Math.max(8, now - pointer.t);
    if (pointer.on) { pointer.vx = (x - pointer.x) / dt * 1000; pointer.vy = (y - pointer.y) / dt * 1000; }
    pointer.x = x; pointer.y = y; pointer.t = now; pointer.on = true;
  };
  addEventListener('pointermove', e => setPointer(e.clientX, e.clientY), { passive: true });
  addEventListener('touchmove', e => { const t = e.touches[0]; if (t) setPointer(t.clientX, t.clientY); }, { passive: true });
  addEventListener('pointerleave', () => { pointer.on = false; pointer.x = pointer.y = -1e4; });
  addEventListener('touchend', () => { pointer.on = false; pointer.x = pointer.y = -1e4; });

  let lastScroll = scrollY, scrollDy = 0;

  function snow(slide) {
    const cv = slide.querySelector('.snow'), ctx = cv.getContext('2d');
    const dark = slide.classList.contains('dark');
    const cols = JSON.parse(cv.dataset.col).map(c => ({ ...c, n: c.y.length, h: new Float32Array(c.y.length) }));
    let w = 0, h = 0, U = 1;
    const size = () => {
      const dpr = dprOf(); w = cv.clientWidth; h = cv.clientHeight; U = w / 1000;
      cv.width = Math.max(1, w * dpr); cv.height = Math.max(1, h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    size(); new ResizeObserver(size).observe(cv);
    const HMAX = .0105;
    for (const c of cols) for (let i = 0; i < c.n; i++) {
      const t = i / (c.n - 1), edge = Math.min(1, Math.min(t, 1 - t) * 9);
      c.h[i] = HMAX * edge * (.35 + .25 * Math.sin(t * 7 + c.x0 * 40) + .15 * Math.sin(t * 19));
    }
    const flakes = [];
    const spawn = (x, y, vx, vy, clump) => {
      if (flakes.length > 260) return;
      const r = clump ? rnd(.9, 2.2) : rnd(.7, 2.6);
      flakes.push({ x, y, vx, vy, r, clump, o: rnd(.55, .95), ph: rnd(0, TAU), vt: (clump ? 260 : rnd(28, 60) * (r / 2 + .6)) });
    };
    const colAt = (c, x) => { const t = (x / w - c.x0) / (c.x1 - c.x0); return t < 0 || t > 1 ? -1 : Math.round(t * (c.n - 1)); };
    const surface = (c, i) => (c.y[i] - c.h[i]) * w;
    const knock = (c, i, amount, vx, vy) => {
      const take = Math.min(c.h[i], amount); if (take <= 0) return;
      c.h[i] -= take;
      const x = (c.x0 + (c.x1 - c.x0) * i / (c.n - 1)) * w, y = surface(c, i);
      const count = Math.min(3, Math.ceil(take / .0012));
      for (let k = 0; k < count; k++) spawn(x + rnd(-2, 2) * U, y - rnd(0, 3) * U, vx + rnd(-60, 60) * U, vy + rnd(-90, 10) * U, true);
    };
    const relax = c => {
      const bw = (c.x1 - c.x0) / (c.n - 1), lim = bw * .55;
      for (let pass = 0; pass < 2; pass++) for (let i = 0; i < c.n - 1; i++) {
        const d = c.h[i] - c.h[i + 1];
        if (Math.abs(d) > lim) { const m = (Math.abs(d) - lim) / 2 * Math.sign(d); c.h[i] -= m; c.h[i + 1] += m; }
      }
      c.h[0] *= .9; c.h[c.n - 1] *= .9;
    };
    let acc = 0;
    return (dt) => {
      if (!slide.classList.contains('live') || !w) return;
      const rect = cv.getBoundingClientRect();
      const px = pointer.x - rect.left, py = pointer.y - rect.top, R = 75 * U;
      const near = px > -R && px < w + R && py > -R && py < h + R;
      acc += dt * 16 * (w / 1000 + .4);
      while (acc > 1) { acc--; spawn(rnd(-20, w + 20), -6, rnd(-8, 8) * U, rnd(20, 50) * U, false); }
      const shake = Math.abs(scrollV);
      if (shake > 500) {
        const f = Math.min(.35, (shake - 500) / 6000) * dt * 60;
        for (const c of cols) for (let i = 0; i < c.n; i += 2) if (c.h[i] > .0004 && Math.random() < .5) knock(c, i, c.h[i] * f, rnd(-40, 40) * U, -Math.sign(scrollV) * rnd(20, 90) * U);
      }
      if (near && pointer.on) {
        const sp = Math.min(1, Math.hypot(pointer.vx, pointer.vy) / 1400);
        for (const c of cols) {
          if ((px + R * .6) / w < c.x0 || (px - R * .6) / w > c.x1) continue;
          const i0 = colAt(c, px - R * .6), i1 = colAt(c, px + R * .6);
          const a = i0 < 0 ? 0 : i0, b = i1 < 0 ? c.n - 1 : i1;
          for (let i = a; i <= b; i++) {
            const sx = (c.x0 + (c.x1 - c.x0) * i / (c.n - 1)) * w, sy = surface(c, i), dd = Math.hypot(sx - px, sy - py);
            if (dd < R * .6) knock(c, i, HMAX * (1 - dd / (R * .6)) * (.05 + .5 * sp) * dt * 30, pointer.vx * .25 + (sx - px) * 3, Math.min(0, pointer.vy * .25) - rnd(40, 120) * U);
          }
        }
      }
      for (let k = flakes.length - 1; k >= 0; k--) {
        const f = flakes[k], py0 = f.y;
        if (f.clump) f.vy += 900 * U * dt;
        else { f.ph += dt * 1.3; f.vy += (f.vt * U - f.vy) * dt * 1.5; f.vx += (Math.sin(f.ph) * 14 * U - f.vx) * dt * .8; }
        if (f.vy > f.vt * U * (f.clump ? 1.6 : 1.4)) f.vy = f.vt * U * (f.clump ? 1.6 : 1.4);
        f.vx *= f.clump ? .995 : 1;
        if (near) {
          const dx = f.x - px, dy = f.y - py, dd = Math.hypot(dx, dy);
          if (dd < R && dd > .1) {
            const s = (1 - dd / R);
            f.vx += (dx / dd * 520 * U + pointer.vx * .5) * s * dt * 3; f.vy += (dy / dd * 520 * U + pointer.vy * .5) * s * dt * 3;
          }
        }
        f.x += f.vx * dt; f.y += f.vy * dt + scrollDy * .3;
        if (f.vy > 0) for (const c of cols) {
          const i = colAt(c, f.x); if (i < 0) continue;
          const sy = surface(c, i);
          if (py0 <= sy + 1 && f.y >= sy) {
            if (c.h[i] < HMAX) c.h[i] += f.r * f.r * .00004 * (f.clump ? 1.4 : 1);
            flakes.splice(k, 1); break;
          }
        }
        if (flakes[k] === f && (f.y > h + 20 || f.x < -60 || f.x > w + 60 || f.y < -200)) flakes.splice(k, 1);
      }
      for (const c of cols) relax(c);
      ctx.clearRect(0, 0, w, h);
      for (const c of cols) {
        let mx = 0; for (let i = 0; i < c.n; i++) mx = Math.max(mx, c.h[i]);
        if (mx < .0003) continue;
        ctx.beginPath();
        for (let i = 0; i < c.n; i++) ctx.lineTo((c.x0 + (c.x1 - c.x0) * i / (c.n - 1)) * w, surface(c, i));
        for (let i = c.n - 1; i >= 0; i--) ctx.lineTo((c.x0 + (c.x1 - c.x0) * i / (c.n - 1)) * w, c.y[i] * w + .6);
        ctx.closePath();
        ctx.shadowColor = dark ? 'rgba(10,30,70,.35)' : 'rgba(60,95,150,.35)'; ctx.shadowBlur = 4 * U + 1; ctx.shadowOffsetY = 1;
        const g = ctx.createLinearGradient(0, (c.y[0] - HMAX) * w, 0, c.y[0] * w);
        g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e4eefa');
        ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      }
      for (const f of flakes) {
        ctx.globalAlpha = f.o; ctx.fillStyle = '#fff';
        if (!dark) { ctx.shadowColor = 'rgba(70,110,170,.55)'; ctx.shadowBlur = 2.5; }
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (U * .7 + .35), 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    };
  }

  // ---------- запуск ----------
  // при каждом новом заходе на слайд: блик по карточкам и слова заголовка
  function greet(s) {
    const now = performance.now();
    if (now - (+s.dataset.gt || -1e9) < 4000) return;
    s.dataset.gt = now; s.dataset.wt = now;
    words(s, 500);
    // блик при заходе - только если с прошлого прошло 15 с, и после слов заголовка
    if (now - lastShine > 15000 && s.querySelector('.gl')) {
      lastShine = now; nextShine = now + rnd(15000, 22000);
      setTimeout(() => { if (s.classList.contains('live')) shineRandom(s); }, 1600);
    }
  }
  function play(s) {
    if (s.dataset.done) { if (!still) greet(s); return; }
    s.dataset.done = 1;
    s.classList.add('played');
    if (still) return;
    s.querySelectorAll('.arc').forEach(drawArc);
    greet(s);
  }
  // слова заголовка по очереди слегка увеличиваются и встают обратно
  function words(s, delay) {
    s.querySelectorAll('.word').forEach(w => w.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(1.09)', offset: .4 }, { transform: 'scale(1)' }],
      { duration: 750, delay: delay + (+w.dataset.k) * 230, easing: 'cubic-bezier(.3,.6,.3,1)' }));
  }
  setInterval(() => {
    if (still || document.hidden) return;
    const now = performance.now();
    slides.forEach(s => {
      if (s.classList.contains('live') && s.dataset.done && now - (+s.dataset.wt || 0) > 35000 && now - lastShine > 3000 && nextShine - now > 3000) { s.dataset.wt = now; words(s, 0); }
    });
  }, 2000);
  const reveal = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { thaw(e.target); reveal.unobserve(e.target); }
  }), { threshold: .3 });
  const liveObs = new IntersectionObserver(es => es.forEach(e => {
    e.target.classList.toggle('live', e.isIntersecting);
    if (e.isIntersecting && e.intersectionRatio > .45) play(e.target);
  }), { threshold: [0, .5] });
  slides.forEach(s => { reveal.observe(s); liveObs.observe(s); });
  if (still) { slides.forEach(play); return; }

  const sims = slides.filter(s => s.querySelector('.snow')).map(snow);
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    scrollDy = scrollY - lastScroll; lastScroll = scrollY;
    scrollV = scrollV * .8 + (dt ? scrollDy / dt : 0) * .2;
    for (const s of sims) s(dt);
    for (const s of swings) s(dt, now / 1000);
    pointer.vx *= .9; pointer.vy *= .9;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
